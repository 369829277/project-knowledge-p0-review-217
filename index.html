<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,nofollow,noarchive"/><title>项目知库 · P0 v2.17 UI 设计审阅</title><style>

:root {
  --page: #f5f5f2;
  --surface: #ffffff;
  --text: #17191c;
  --secondary: #5f6368;
  --muted: #898c91;
  --border: #deded8;
  --soft: #f0f0ec;
  --active: #e8e8e3;
  --link: #245fd6;
  --warning: #fff7dc;
  --code: #1f2329;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 88px;
}

body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}

a {
  color: var(--link);
}

.site-shell {
  min-height: 100vh;
}

.topbar {
  position: sticky;
  z-index: 30;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 68px;
  padding: 10px 28px;
  border-bottom: 1px solid var(--border);
  background: rgba(250, 250, 248, 0.94);
  backdrop-filter: blur(16px);
}

.eyebrow,
.topbar-title,
.topbar-actions span,
.toc-title,
.toc-help {
  margin: 0;
}

.eyebrow {
  color: var(--secondary);
  font-size: 12px;
}

.topbar-title {
  margin-top: 2px;
  font-size: 17px;
  font-weight: 650;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 18px;
  color: var(--secondary);
  font-size: 12px;
}

.topbar-actions a {
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  text-decoration: none;
}

.review-layout {
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr);
  max-width: 1500px;
  margin: 0 auto;
}

.toc {
  position: sticky;
  top: 68px;
  align-self: start;
  height: calc(100vh - 68px);
  padding: 28px 18px 32px 24px;
  overflow-y: auto;
  border-right: 1px solid var(--border);
}

.toc-title {
  font-size: 13px;
  font-weight: 700;
}

.toc-help {
  margin-top: 7px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.55;
}

.toc nav {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-top: 16px;
}

.toc nav a {
  padding: 8px 9px;
  border-radius: 7px;
  color: var(--secondary);
  font-size: 12px;
  line-height: 1.45;
  text-decoration: none;
}

.toc nav a:hover,
.toc nav a:focus-visible {
  background: var(--active);
  color: var(--text);
  outline: none;
}

.document-wrap {
  min-width: 0;
  padding: 30px clamp(22px, 5vw, 72px) 100px;
}

.document-note {
  max-width: 1060px;
  margin: 0 auto 18px;
  padding: 11px 14px;
  border: 1px solid #eadba0;
  border-radius: 9px;
  background: var(--warning);
  color: #6e5611;
  font-size: 12px;
}

.markdown-body {
  max-width: 1060px;
  margin: 0 auto;
  padding: 48px clamp(24px, 5vw, 68px) 80px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  box-shadow: 0 10px 32px rgba(20, 24, 28, 0.05);
}

.markdown-body h1 {
  margin: 0 0 34px;
  font-size: clamp(27px, 4vw, 38px);
  line-height: 1.25;
  letter-spacing: -0.025em;
}

.markdown-body h2 {
  margin: 64px 0 20px;
  padding-top: 6px;
  border-top: 1px solid var(--border);
  font-size: 23px;
  line-height: 1.35;
}

.markdown-body h3 {
  margin: 36px 0 14px;
  font-size: 17px;
  line-height: 1.45;
}

.markdown-body h4 {
  margin: 26px 0 12px;
  font-size: 15px;
}

.markdown-body p,
.markdown-body li {
  font-size: 14px;
  line-height: 1.8;
}

.markdown-body ul,
.markdown-body ol {
  padding-left: 1.4rem;
}

.markdown-body li + li {
  margin-top: 5px;
}

.markdown-body code {
  padding: 2px 5px;
  border-radius: 5px;
  background: var(--soft);
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 0.9em;
}

.markdown-body pre {
  overflow-x: auto;
  padding: 18px;
  border-radius: 10px;
  background: var(--code);
  color: #f6f7f8;
  font-size: 12px;
  line-height: 1.65;
}

.markdown-body pre code {
  padding: 0;
  background: transparent;
}

.markdown-body table {
  display: block;
  width: 100%;
  margin: 16px 0 26px;
  overflow-x: auto;
  border-collapse: collapse;
  font-size: 12px;
}

.markdown-body th,
.markdown-body td {
  min-width: 116px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  vertical-align: top;
  line-height: 1.6;
}

.markdown-body th {
  background: var(--soft);
  text-align: left;
  font-weight: 650;
}

.markdown-body blockquote {
  margin: 20px 0;
  padding: 4px 16px;
  border-left: 3px solid var(--border);
  color: var(--secondary);
}

.image-link {
  display: block;
  margin: 18px 0 38px;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: #151515;
  box-shadow: 0 7px 18px rgba(20, 24, 28, 0.07);
}

.image-link img {
  display: block;
  width: 100%;
  height: auto;
  transition: transform 180ms ease;
}

.image-link:hover img {
  transform: scale(1.006);
}

@media (max-width: 900px) {
  .topbar {
    padding-inline: 18px;
  }

  .topbar-actions span {
    display: none;
  }

  .review-layout {
    display: block;
  }

  .toc {
    position: relative;
    top: auto;
    height: auto;
    padding: 16px 18px;
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }

  .toc nav {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .document-wrap {
    padding: 18px 12px 60px;
  }

  .markdown-body {
    padding: 32px 18px 60px;
    border-radius: 9px;
  }
}

@media (max-width: 560px) {
  .toc nav {
    grid-template-columns: 1fr;
  }

  .markdown-body h2 {
    font-size: 20px;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  .image-link img {
    transition: none;
  }
}

.topbar-actions button{padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--text);cursor:pointer}
#image-dialog{width:min(96vw,1600px);max-width:none;padding:46px 12px 12px;border:0;border-radius:12px;background:#111;color:#fff}#image-dialog::backdrop{background:rgba(0,0,0,.78)}#image-dialog img{display:block;width:100%;height:auto}#close-dialog{position:absolute;right:12px;top:10px;padding:7px 11px;border:1px solid #555;border-radius:7px;background:#242424;color:#fff;cursor:pointer}
.unlock-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.unlock-card{width:min(430px,100%);padding:36px;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 16px 46px rgba(20,24,28,.08)}.unlock-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:#17191c;color:#fff;font-weight:700}.unlock-card .eyebrow{margin-top:22px}.unlock-card h1{margin:5px 0 0;font-size:24px}.unlock-desc{margin:12px 0 24px;color:var(--secondary);font-size:13px;line-height:1.65}.unlock-card label{display:block;margin-bottom:7px;font-size:12px;font-weight:650}.unlock-card input{width:100%;height:44px;padding:0 12px;border:1px solid #cfcfc9;border-radius:8px;font:inherit;outline:none}.unlock-card input:focus{border-color:#245fd6;box-shadow:0 0 0 3px rgba(36,95,214,.12)}.unlock-card button{width:100%;height:44px;margin-top:12px;border:0;border-radius:8px;background:#17191c;color:#fff;font:inherit;font-weight:650;cursor:pointer}.unlock-error{min-height:18px;margin:10px 0 0;color:#b42318;font-size:12px}.unlock-note{margin:16px 0 0;color:#8a8d91;font-size:11px;line-height:1.55}</style></head>
<body><main id="app" class="unlock-shell"><section class="unlock-card"><div class="unlock-mark">知</div><p class="eyebrow">加密的设计审阅页</p><h1>项目知库 · P0 v2.17</h1><p class="unlock-desc">输入分享人提供的访问密码。正文和 83 张图片只会在你的浏览器中解密。</p><form id="unlock-form"><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" required autofocus/><button type="submit">解密并进入审阅</button><p id="error" class="unlock-error" role="alert"></p></form><p class="unlock-note">公开服务器只保存加密后的密文；密码不会上传或保存在网页中。</p></section></main>
<script>
const app=document.getElementById('app');const form=document.getElementById('unlock-form');const input=document.getElementById('password');const error=document.getElementById('error');
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toBlobUrl=b64=>{const bytes=fromB64(b64);return URL.createObjectURL(new Blob([bytes],{type:'image/png'}));};
form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';const button=form.querySelector('button');button.disabled=true;button.textContent='正在解密…';try{const meta=await fetch('./review.enc',{cache:'no-store'}).then(r=>r.json());const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(meta.salt),iterations:meta.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(meta.iv)},key,fromB64(meta.data));const payload=JSON.parse(new TextDecoder().decode(plain));const urls={};for(const [id,b64] of Object.entries(payload.images))urls[id]=toBlobUrl(b64);app.className='';app.innerHTML=payload.body;document.querySelectorAll('[data-image]').forEach(img=>img.src=urls[img.dataset.image]);const dialog=document.getElementById('image-dialog');const dialogImage=document.getElementById('dialog-image');document.querySelectorAll('[data-open-image]').forEach(link=>link.addEventListener('click',e=>{e.preventDefault();dialogImage.src=urls[link.dataset.openImage];dialog.showModal();}));document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());document.getElementById('relock').addEventListener('click',()=>location.reload());}catch(e){error.textContent='密码不正确，或加密内容暂时无法读取。';button.disabled=false;button.textContent='解密并进入审阅';input.select();}});
</script></body></html>
